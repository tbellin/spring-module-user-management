spring:
  application:
    name: user-management
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 5000
  mvc:
    problemdetails:
      enabled: true  # Enable RFC 9457 ProblemDetail error responses

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}  # 1 hour default
    remember-me-expiration-ms: ${JWT_REMEMBER_ME_EXPIRATION_MS:604800000}  # 7 days default
  mail:
    from: ${MAIL_FROM:noreply@jbeltsolution.com}
  verification:
    expiration-hours: ${VERIFICATION_EXPIRATION_HOURS:24}
    base-url: ${APP_BASE_URL:http://localhost:8080}

server:
  port: ${APP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
