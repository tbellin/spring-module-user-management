<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>User Management</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>User Management</h2>
            <a th:href="@{/admin/users/new}" class="btn btn-primary">Create User</a>
        </div>

        <!-- Search and Filter Bar -->
        <form th:action="@{/admin/users}" method="get" class="card card-body mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="search" class="form-label">Search</label>
                    <input type="text" class="form-control" id="search" name="search"
                           th:value="${search}" placeholder="Search by name or email...">
                </div>
                <div class="col-md-2">
                    <label for="role" class="form-label">Role</label>
                    <select class="form-select" id="role" name="role">
                        <option value="">All Roles</option>
                        <option value="ROLE_USER" th:selected="${role == 'ROLE_USER'}">User</option>
                        <option value="ROLE_ADMIN" th:selected="${role == 'ROLE_ADMIN'}">Admin</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" name="status">
                        <option value="">All Status</option>
                        <option value="active" th:selected="${status == 'active'}">Active</option>
                        <option value="disabled" th:selected="${status == 'disabled'}">Disabled</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary w-100">Search</button>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/admin/users}" class="btn btn-outline-secondary w-100">Clear</a>
                </div>
            </div>
        </form>

        <!-- Data Table -->
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <th>
                            <a th:href="@{/admin/users(sort='email',
                                direction=${currentSort == 'email' && currentDirection == 'asc' ? 'desc' : 'asc'},
                                search=${search}, role=${role}, status=${status})}"
                               class="text-decoration-none text-dark">
                                Email
                                <span th:if="${currentSort == 'email'}"
                                      th:text="${currentDirection == 'asc' ? '&#9650;' : '&#9660;'}"></span>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/admin/users(sort='firstName',
                                direction=${currentSort == 'firstName' && currentDirection == 'asc' ? 'desc' : 'asc'},
                                search=${search}, role=${role}, status=${status})}"
                               class="text-decoration-none text-dark">
                                Name
                                <span th:if="${currentSort == 'firstName'}"
                                      th:text="${currentDirection == 'asc' ? '&#9650;' : '&#9660;'}"></span>
                            </a>
                        </th>
                        <th>
                            <a th:href="@{/admin/users(sort='roles',
                                direction=${currentSort == 'roles' && currentDirection == 'asc' ? 'desc' : 'asc'},
                                search=${search}, role=${role}, status=${status})}"
                               class="text-decoration-none text-dark">
                                Role
                                <span th:if="${currentSort == 'roles'}"
                                      th:text="${currentDirection == 'asc' ? '&#9650;' : '&#9660;'}"></span>
                            </a>
                        </th>
                        <th>Status</th>
                        <th>
                            <a th:href="@{/admin/users(sort='createdAt',
                                direction=${currentSort == 'createdAt' && currentDirection == 'asc' ? 'desc' : 'asc'},
                                search=${search}, role=${role}, status=${status})}"
                               class="text-decoration-none text-dark">
                                Created
                                <span th:if="${currentSort == 'createdAt'}"
                                      th:text="${currentDirection == 'asc' ? '&#9650;' : '&#9660;'}"></span>
                            </a>
                        </th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users.content}" th:attr="data-user-id=${user.id()}">
                        <!-- Display Mode -->
                        <td class="display-mode" th:text="${user.email()}">user@example.com</td>
                        <td class="display-mode">
                            <span th:text="${(user.firstName() != null ? user.firstName() : '') + ' ' + (user.lastName() != null ? user.lastName() : '')}"></span>
                        </td>
                        <td class="display-mode">
                            <span th:each="r : ${user.roles()}"
                                  class="badge bg-secondary me-1"
                                  th:text="${#strings.replace(r, 'ROLE_', '')}">USER</span>
                        </td>
                        <td>
                            <div class="form-check form-switch">
                                <input type="checkbox" class="form-check-input" role="switch"
                                       th:checked="${user.enabled()}"
                                       th:attr="onchange='toggleUserStatus(this, ' + ${user.id()} + ')'">
                            </div>
                        </td>
                        <td class="display-mode" th:text="${#temporals.format(user.createdAt(), 'yyyy-MM-dd')}">2026-01-01</td>
                        <td class="display-mode">
                            <button type="button" class="btn btn-sm btn-outline-primary"
                                    th:attr="onclick='editRow(' + ${user.id()} + ')'">
                                Edit
                            </button>
                        </td>

                        <!-- Edit Mode (hidden by default) -->
                        <td class="edit-mode d-none" th:text="${user.email()}">user@example.com</td>
                        <td class="edit-mode d-none">
                            <div class="d-flex gap-1">
                                <input type="text" class="form-control form-control-sm edit-firstName"
                                       th:value="${user.firstName()}" placeholder="First name">
                                <input type="text" class="form-control form-control-sm edit-lastName"
                                       th:value="${user.lastName()}" placeholder="Last name">
                            </div>
                        </td>
                        <td class="edit-mode d-none">
                            <select class="form-select form-select-sm edit-role">
                                <option value="ROLE_USER"
                                        th:selected="${user.roles().contains('ROLE_USER')}">User</option>
                                <option value="ROLE_ADMIN"
                                        th:selected="${user.roles().contains('ROLE_ADMIN')}">Admin</option>
                            </select>
                        </td>
                        <!-- Status cell is shared (not duplicated) -->
                        <td class="edit-mode d-none" th:text="${#temporals.format(user.createdAt(), 'yyyy-MM-dd')}">2026-01-01</td>
                        <td class="edit-mode d-none">
                            <div class="d-flex gap-1">
                                <button type="button" class="btn btn-sm btn-success"
                                        th:attr="onclick='saveRow(' + ${user.id()} + ')'">Save</button>
                                <button type="button" class="btn btn-sm btn-outline-secondary"
                                        th:attr="onclick='cancelEdit(' + ${user.id()} + ')'">Cancel</button>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${users.content.isEmpty()}">
                        <td colspan="6" class="text-center text-muted py-4">No users found.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${users.totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">
            <span class="text-muted" th:text="'Showing ' + ${users.numberOfElements} + ' of ' + ${users.totalElements} + ' users'">Showing 10 of 100 users</span>
            <nav>
                <ul class="pagination mb-0">
                    <!-- Previous -->
                    <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(page=${users.number - 1},
                            search=${search}, role=${role}, status=${status},
                            sort=${currentSort}, direction=${currentDirection})}"
                           th:if="${!users.first}">Previous</a>
                        <span class="page-link" th:if="${users.first}">Previous</span>
                    </li>
                    <!-- Page numbers -->
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}"
                        th:classappend="${i == users.number} ? 'active'">
                        <a class="page-link" th:href="@{/admin/users(page=${i},
                            search=${search}, role=${role}, status=${status},
                            sort=${currentSort}, direction=${currentDirection})}"
                           th:text="${i + 1}">1</a>
                    </li>
                    <!-- Next -->
                    <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(page=${users.number + 1},
                            search=${search}, role=${role}, status=${status},
                            sort=${currentSort}, direction=${currentDirection})}"
                           th:if="${!users.last}">Next</a>
                        <span class="page-link" th:if="${users.last}">Next</span>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- Undo Toast Container (for toggle operations) -->
        <div class="toast-container position-fixed top-0 end-0 p-3" id="undoToastContainer">
            <div id="undoToast" class="toast" role="alert" data-bs-autohide="true" data-bs-delay="8000">
                <div class="toast-header bg-info text-white">
                    <strong class="me-auto" id="undoToastTitle">User Updated</strong>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast"></button>
                </div>
                <div class="toast-body d-flex justify-content-between align-items-center">
                    <span id="undoToastMessage">User status changed.</span>
                    <button type="button" class="btn btn-sm btn-outline-primary ms-2" id="undoBtn">Undo</button>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            var csrfToken = document.querySelector('meta[name="_csrf"]').content;
            var csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

            /**
             * Switch a table row into edit mode.
             */
            function editRow(userId) {
                var row = document.querySelector('tr[data-user-id="' + userId + '"]');
                if (!row) return;

                // Hide display-mode cells, show edit-mode cells
                row.querySelectorAll('.display-mode').forEach(function(el) {
                    el.classList.add('d-none');
                });
                row.querySelectorAll('.edit-mode').forEach(function(el) {
                    el.classList.remove('d-none');
                });
            }

            /**
             * Cancel editing and switch back to display mode.
             */
            function cancelEdit(userId) {
                var row = document.querySelector('tr[data-user-id="' + userId + '"]');
                if (!row) return;

                // Show display-mode cells, hide edit-mode cells
                row.querySelectorAll('.display-mode').forEach(function(el) {
                    el.classList.remove('d-none');
                });
                row.querySelectorAll('.edit-mode').forEach(function(el) {
                    el.classList.add('d-none');
                });
            }

            /**
             * Save edited row data via REST API PUT call.
             */
            function saveRow(userId) {
                var row = document.querySelector('tr[data-user-id="' + userId + '"]');
                if (!row) return;

                var firstName = row.querySelector('.edit-firstName').value;
                var lastName = row.querySelector('.edit-lastName').value;
                var role = row.querySelector('.edit-role').value;

                var headers = {
                    'Content-Type': 'application/json'
                };
                headers[csrfHeader] = csrfToken;

                fetch('/api/v1/admin/users/' + userId, {
                    method: 'PUT',
                    headers: headers,
                    body: JSON.stringify({
                        firstName: firstName,
                        lastName: lastName,
                        role: role
                    })
                })
                .then(function(response) {
                    if (!response.ok) {
                        return response.json().then(function(err) {
                            throw new Error(err.detail || err.message || 'Update failed');
                        });
                    }
                    return response.json();
                })
                .then(function(data) {
                    // Update display cells with new values
                    var displayCells = row.querySelectorAll('.display-mode');
                    // Cell 0: email (unchanged)
                    // Cell 1: name
                    var nameText = (data.firstName || '') + ' ' + (data.lastName || '');
                    displayCells[1].querySelector('span').textContent = nameText.trim();
                    // Cell 2: role badges
                    var rolesHtml = '';
                    data.roles.forEach(function(r) {
                        rolesHtml += '<span class="badge bg-secondary me-1">' + r.replace('ROLE_', '') + '</span>';
                    });
                    displayCells[2].innerHTML = rolesHtml;

                    // Switch back to display mode
                    cancelEdit(userId);
                })
                .catch(function(error) {
                    alert('Error updating user: ' + error.message);
                });
            }

            /**
             * Toggle user enabled/disabled via REST API PATCH call.
             * Shows undo toast on success.
             */
            function toggleUserStatus(checkbox, userId) {
                var enabled = checkbox.checked;
                var headers = {
                    'Content-Type': 'application/json'
                };
                headers[csrfHeader] = csrfToken;

                fetch('/api/v1/admin/users/' + userId + '/status', {
                    method: 'PATCH',
                    headers: headers,
                    body: JSON.stringify({ enabled: enabled })
                })
                .then(function(response) {
                    if (!response.ok) {
                        return response.json().then(function(err) {
                            throw new Error(err.detail || err.message || 'Toggle failed');
                        });
                    }
                    return response.json();
                })
                .then(function(data) {
                    // Show undo toast
                    var action = enabled ? 'enabled' : 'disabled';
                    var toastMessage = document.getElementById('undoToastMessage');
                    var undoBtn = document.getElementById('undoBtn');
                    toastMessage.textContent = 'User ' + action + '.';

                    // Set up undo handler
                    undoBtn.onclick = function() {
                        checkbox.checked = !enabled;
                        toggleUserStatus(checkbox, userId);
                    };

                    var toastEl = document.getElementById('undoToast');
                    var toast = new bootstrap.Toast(toastEl);
                    toast.show();
                })
                .catch(function(error) {
                    // Revert checkbox on error
                    checkbox.checked = !enabled;
                    alert('Error: ' + error.message);
                });
            }
        </script>
    </th:block>
</body>
</html>
