<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>You've been invited</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
    <p>You've been invited to join User Management.</p>
    <p>Click the button below to set your password and activate your account:</p>
    <p>
        <a th:href="${setPasswordLink}"
           style="display: inline-block; padding: 10px 20px; background-color: #0d6efd; color: white; text-decoration: none; border-radius: 4px;">
            Set Your Password
        </a>
    </p>
    <p>Or copy and paste this URL into your browser:</p>
    <p th:text="${setPasswordLink}"></p>
    <p>This link will expire in 24 hours.</p>
    <p>If you didn't expect this invitation, you can safely ignore this email.</p>
</body>
</html>
