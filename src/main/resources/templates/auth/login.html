<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Login</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Login</h2>

                        <!-- Error message (from Spring Security) -->
                        <div th:if="${param.error}" class="alert alert-danger">
                            Invalid email or password.
                        </div>

                        <!-- Logout message -->
                        <div th:if="${param.logout}" class="alert alert-info">
                            You have been logged out.
                        </div>

                        <!-- Login form - Spring Security handles POST to /login -->
                        <form th:action="@{/login}" method="post">
                            <!-- CSRF auto-injected by Thymeleaf -->

                            <div class="mb-3">
                                <label for="username" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="username" name="username"
                                       required autofocus>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="password" name="password" required>
                                    <button class="btn btn-outline-secondary" type="button"
                                            onclick="togglePassword('password', this)">
                                        <span>Show</span>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                                <label class="form-check-label" for="remember-me">Remember me</label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Sign In</button>
                        </form>

                        <p class="text-center mt-3">
                            Don't have an account? <a th:href="@{/register}">Register</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            function togglePassword(inputId, button) {
                const input = document.getElementById(inputId);
                const span = button.querySelector('span');
                if (input.type === 'password') {
                    input.type = 'text';
                    span.textContent = 'Hide';
                } else {
                    input.type = 'password';
                    span.textContent = 'Show';
                }
            }
        </script>
    </th:block>
</body>
</html>
