<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Register</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Create Account</h2>

                        <!-- Registration form -->
                        <form th:action="@{/register}" th:object="${registrationForm}" method="post" novalidate>
                            <!-- CSRF auto-injected by Thymeleaf -->

                            <!-- Error summary at top (per CONTEXT.md) - must be inside form for #fields to work -->
                            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                                <ul class="mb-0">
                                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                                </ul>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" th:field="*{email}" id="email"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required autofocus>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" th:field="*{firstName}" id="firstName"
                                           th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" th:field="*{lastName}" id="lastName"
                                           th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" th:field="*{password}" id="password"
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                           minlength="8" required>
                                    <button class="btn btn-outline-secondary" type="button"
                                            onclick="togglePassword('password', this)">
                                        <span>Show</span>
                                    </button>
                                </div>
                                <div class="form-text">Minimum 8 characters</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Create Account</button>
                        </form>

                        <p class="text-center mt-3">
                            Already have an account? <a th:href="@{/login}">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            function togglePassword(inputId, button) {
                const input = document.getElementById(inputId);
                const span = button.querySelector('span');
                if (input.type === 'password') {
                    input.type = 'text';
                    span.textContent = 'Hide';
                } else {
                    input.type = 'password';
                    span.textContent = 'Show';
                }
            }
        </script>
    </th:block>
</body>
</html>
