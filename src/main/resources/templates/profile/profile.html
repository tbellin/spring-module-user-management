<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>My Profile</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">My Profile</h5>
                        <button type="button" class="btn btn-sm btn-outline-primary" id="editBtn" onclick="toggleEditMode()">Edit</button>
                    </div>
                    <div class="card-body">

                        <!-- Read-only information -->
                        <div class="mb-4">
                            <div class="row mb-2">
                                <div class="col-sm-4 text-muted">Email</div>
                                <div class="col-sm-8" th:text="${user.email()}">user@example.com</div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-sm-4 text-muted">Role</div>
                                <div class="col-sm-8">
                                    <span th:each="role : ${user.roles()}"
                                          class="badge bg-secondary me-1"
                                          th:text="${#strings.replace(role, 'ROLE_', '')}">USER</span>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-sm-4 text-muted">Account Status</div>
                                <div class="col-sm-8">
                                    <span th:if="${user.enabled()}" class="badge bg-success">Active</span>
                                    <span th:unless="${user.enabled()}" class="badge bg-danger">Disabled</span>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-sm-4 text-muted">Member Since</div>
                                <div class="col-sm-8" th:text="${#temporals.format(user.createdAt(), 'MMMM d, yyyy')}">January 1, 2026</div>
                            </div>
                        </div>

                        <hr>

                        <!-- Editable fields (view mode) -->
                        <div id="viewMode">
                            <div class="row mb-2">
                                <div class="col-sm-4 text-muted">Display Name</div>
                                <div class="col-sm-8" th:text="${user.username() ?: '-'}">username</div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-sm-4 text-muted">First Name</div>
                                <div class="col-sm-8" th:text="${user.firstName() ?: '-'}">-</div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-sm-4 text-muted">Last Name</div>
                                <div class="col-sm-8" th:text="${user.lastName() ?: '-'}">-</div>
                            </div>
                        </div>

                        <!-- Editable fields (edit mode) -->
                        <div id="editMode" style="display: none;">
                            <form th:action="@{/profile}" method="post">
                                <div class="mb-3">
                                    <label for="displayName" class="form-label">Display Name</label>
                                    <input type="text" class="form-control" id="displayName"
                                           name="displayName" maxlength="100"
                                           th:value="${user.username()}">
                                </div>
                                <div class="mb-3">
                                    <label for="firstName" class="form-label">First Name</label>
                                    <input type="text" class="form-control" id="firstName"
                                           name="firstName" maxlength="100"
                                           th:value="${user.firstName()}">
                                </div>
                                <div class="mb-3">
                                    <label for="lastName" class="form-label">Last Name</label>
                                    <input type="text" class="form-control" id="lastName"
                                           name="lastName" maxlength="100"
                                           th:value="${user.lastName()}">
                                </div>
                                <div class="d-flex gap-2">
                                    <button type="submit" class="btn btn-primary">Save</button>
                                    <button type="button" class="btn btn-outline-secondary" onclick="toggleEditMode()">Cancel</button>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            function toggleEditMode() {
                var viewMode = document.getElementById('viewMode');
                var editMode = document.getElementById('editMode');
                var editBtn = document.getElementById('editBtn');

                if (editMode.style.display === 'none') {
                    viewMode.style.display = 'none';
                    editMode.style.display = 'block';
                    editBtn.style.display = 'none';
                } else {
                    viewMode.style.display = 'block';
                    editMode.style.display = 'none';
                    editBtn.style.display = 'inline-block';
                }
            }
        </script>
    </th:block>
</body>
</html>
