<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Home</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <h1 class="mb-4">User Management System</h1>
                <p class="lead">Application is running successfully.</p>

                <div class="card mt-4">
                    <div class="card-body">
                        <h5 class="card-title">System Status</h5>
                        <ul class="list-group list-group-flush">
                            <li class="list-group-item d-flex justify-content-between">
                                <span>Active Profile</span>
                                <span class="badge bg-primary" th:text="${activeProfile}">unknown</span>
                            </li>
                            <li class="list-group-item d-flex justify-content-between">
                                <span>Application Status</span>
                                <span class="badge bg-success">Running</span>
                            </li>
                        </ul>
                    </div>
                </div>

                <div class="alert alert-info mt-4" th:if="${activeProfile == 'dev'}">
                    <strong>Development Mode:</strong> H2 Console available at
                    <a th:href="@{/h2-console}">/h2-console</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
